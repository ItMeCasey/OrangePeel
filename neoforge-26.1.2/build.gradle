plugins {
    id 'java-library'
    id 'idea'
    id 'net.neoforged.moddev' version '2.0.148'
}

version = mod_version
group = mod_group

base {
    archivesName = "${mod_id}-neoforge-mc${minecraft_version}"
}

java.toolchain.languageVersion = JavaLanguageVersion.of(25)

// Shared code lives in ../common and is compiled into this loader layer and the combined jar.
sourceSets {
    test {
        java.srcDir '../common/src/test/java'
    }
    main {
        java.srcDir '../version-26.1.2/src/main/java'
        java.srcDir "../common/src/main/java"
        resources.srcDir "../common/src/main/resources"
    }
}

neoForge {
    version = neo_version

    runs {
        configureEach {
            gameDirectory = layout.projectDirectory.dir('run')
        }
        client {
            client()
        }
        server {
            server()
            programArgument '--nogui'
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

// neoforge.mods.toml is a template: this fills in its ${} values from gradle.properties.
var generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    var replaceProperties = [
        minecraft_version: minecraft_version, minecraft_version_range: minecraft_version_range,
        neo_version_range: neo_version_range, loader_version_range: loader_version_range,
        mod_id: mod_id, mod_name: mod_name, mod_license: mod_license, mod_version: mod_version,
        mod_authors: mod_authors, mod_description: mod_description,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from 'src/main/templates'
    into 'build/generated/sources/modMetadata'
}
sourceSets.main.resources.srcDir generateModMetadata

repositories {
    mavenCentral()
    // Dev-only: item viewers for the viewer check, e.g. -Pviewers=curse.maven:jei-238222:9393327 (never in a release build).
    def imcUser = System.getenv('IMC_MAVEN_USER') ?: project.findProperty('imcMavenUser')
    def imcPass = System.getenv('IMC_MAVEN_PASSWORD') ?: project.findProperty('imcMavenPassword')
    if (imcUser && imcPass) {
        maven {
            name = 'ItMeCasey mirror'
            url = 'https://itmecasey.com/maven'
            credentials { username = imcUser; password = imcPass }
            content { includeGroup 'curse.maven' }
        }
    }
    maven { name = 'Cursemaven (fallback)'; url = 'https://cursemaven.com'; content { includeGroup 'curse.maven' } }
}

// Unit tests for the shared logic (food math, comparator ranking); they need no running game.
dependencies {
    (findProperty('viewers') ?: '').toString().split(',').findAll { it }.each { runtimeOnly(it.startsWith('file:') ? files(it.substring(5)) : it) }
    testImplementation platform("org.junit:junit-bom:5.11.4")
    testImplementation "org.junit.jupiter:junit-jupiter"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
}

// The development screenshot tour is not part of a release: it only runs from runClient (the class folders).
tasks.named('jar') {
    exclude 'com/itmecasey/orangepeel/compat/ShotTour*', 'com/itmecasey/orangepeel/compat/UiInput*'
}
