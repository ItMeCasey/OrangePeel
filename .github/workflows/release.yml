name: release

# Push a tag such as v2026.11.1 to build the layers of the Minecraft versions whose two loader modules carry that mod_version,
# combine them into one jar per Minecraft version, publish a GitHub prerelease and upload to CurseForge. Minecraft versions at
# another version are skipped; the run fails when no module carries the tag or when only one loader of a version does.
# A manual run only builds and attaches the jars to the run, unless "publish" is ticked.
# Needs the repository secret CURSEFORGE_TOKEN (a CurseForge upload API token).
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release_type:
        description: CurseForge release type
        type: choice
        options: [beta, alpha, release]
        default: beta
      publish:
        description: Upload to CurseForge (off builds and attaches the jars to the run only)
        type: boolean
        default: false
      dry_run:
        description: Check the CurseForge game version ids and print the upload plan, uploading nothing
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      any: ${{ steps.plan.outputs.any }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: plan
        # Both loader modules of a Minecraft version must carry the tag (the newest version on a manual run); fails otherwise.
        run: python3 .github/scripts/plan_matrix.py release --tag "${GITHUB_REF_NAME}"

  build:
    needs: plan
    if: needs.plan.outputs.any == 'true'
    strategy:
      fail-fast: true
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ matrix.module }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - run: chmod +x gradlew
      - run: ./gradlew build --no-daemon
      - uses: actions/upload-artifact@v5
        with:
          name: ${{ matrix.module }}
          path: |
            ${{ matrix.module }}/build/libs/*.jar
            !${{ matrix.module }}/build/libs/*-sources.jar
            !${{ matrix.module }}/build/libs/*-dev.jar
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v5
        with:
          path: layers

      - name: Check the version
        id: version
        run: |
          # Only the Minecraft versions whose modules carry the tag are built and uploaded (the plan job checked both loaders).
          versions=$(grep -h '^mod_version=' */gradle.properties | sed 's/^mod_version=//' | sort -uV)
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then version="${GITHUB_REF_NAME#v}"; else version=$(echo "$versions" | tail -n 1); fi
          if ! echo "$versions" | grep -qx "$version"; then
            echo "No module has mod_version $version (found: $(echo $versions))"; exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          built=""
          for mc in 1.21.1 26.1.2 26.2 26.3; do
            if [ -d "layers/forge-$mc" ] && [ -d "layers/neoforge-$mc" ]; then built="$built $mc"; fi
          done
          echo "Minecraft versions in this release:$built"
          echo "built=$(echo $built | sed 's/ /, /g')" >> "$GITHUB_OUTPUT"

      - name: Combine the loader jars of each Minecraft version
        run: |
          mkdir -p dist
          for mc in 1.21.1 26.1.2 26.2 26.3; do
            if [ ! -d "layers/forge-$mc" ] || [ ! -d "layers/neoforge-$mc" ]; then
              echo "skipping $mc: not built for this release"
              continue
            fi
            python3 scripts/combine_jars.py "dist/orangepeel-mc$mc-${{ steps.version.outputs.version }}.jar" layers/forge-$mc/*.jar layers/neoforge-$mc/*.jar
          done
          ls -la dist

      - name: Write the release notes
        run: |
          previous=$(git describe --tags --abbrev=0 --match 'v*' "${GITHUB_SHA}^" 2>/dev/null || true)
          {
            echo "One jar per Minecraft version (${{ steps.version.outputs.built }}); each works on Forge and NeoForge."
            echo
            echo "Changes:"
            if [ -n "$previous" ]; then git log --no-merges --pretty='format:- %s' "$previous..${GITHUB_SHA}"; else git log --no-merges -n 20 --pretty='format:- %s'; fi
            echo
          } > notes.md
          cat notes.md

      - name: GitHub release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/*.jar \
            --title "OrangePeel ${{ steps.version.outputs.version }}" \
            --notes-file notes.md \
            --prerelease

      - name: CurseForge dry run (reads the live game version list, uploads nothing)
        if: inputs.dry_run
        env:
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
        run: |
          python3 .github/scripts/publish_curseforge.py \
            --jars dist \
            --version "${{ steps.version.outputs.version }}" \
            --changelog-file notes.md \
            --release-type "${{ inputs.release_type || 'beta' }}" \
            --dry-run

      - name: Upload to CurseForge
        if: (github.ref_type == 'tag' || inputs.publish) && !inputs.dry_run
        env:
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
        run: |
          python3 .github/scripts/publish_curseforge.py \
            --jars dist \
            --version "${{ steps.version.outputs.version }}" \
            --changelog-file notes.md \
            --release-type "${{ inputs.release_type || 'beta' }}"

      - name: Keep the jars with the run
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: release-jars
          path: dist/*.jar
