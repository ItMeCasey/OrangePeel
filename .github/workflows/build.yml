name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  versions:
    # Every module must carry the same mod_version; releases are tagged v<mod_version>.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: All modules agree on mod_version
        run: |
          versions=$(grep -h '^mod_version=' */gradle.properties | sort -u)
          echo "$versions"
          test "$(echo "$versions" | wc -l)" -eq 1

  test:
    # Unit tests for the shared logic that does not need a running game.
    needs: versions
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: neoforge-1.21.1
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - run: chmod +x gradlew
      - run: ./gradlew test --no-daemon

  build:
    needs: versions
    strategy:
      fail-fast: false
      matrix:
        include:
          - module: neoforge-1.21.1
            java: 21
          - module: forge-1.21.1
            java: 21
          - module: neoforge-26.1.2
            java: 25
          - module: forge-26.1.2
            java: 25
          - module: neoforge-26.2
            java: 25
          - module: forge-26.2
            java: 25
          - module: neoforge-26.3
            java: 25
          - module: forge-26.3
            java: 25
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ matrix.module }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - run: chmod +x gradlew
      - run: ./gradlew build --no-daemon
      - uses: actions/upload-artifact@v5
        with:
          name: ${{ matrix.module }}
          path: |
            ${{ matrix.module }}/build/libs/*.jar
            !${{ matrix.module }}/build/libs/*-sources.jar
            !${{ matrix.module }}/build/libs/*-dev.jar

  combine:
    # One combined jar per Minecraft version, holding every loader's layer.
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          path: layers
      - name: Combine the loader jars of each Minecraft version
        run: |
          mkdir -p dist
          for mc in 1.21.1 26.1.2 26.2 26.3; do
            jars=$(ls layers/*-$mc/*.jar)
            echo "$mc: $jars"
            version=$(grep -h '^mod_version=' forge-$mc/gradle.properties | cut -d= -f2)
            python3 scripts/combine_jars.py "dist/orangepeel-mc$mc-$version.jar" $jars
          done
          ls -la dist
      - uses: actions/upload-artifact@v5
        with:
          name: combined-jars
          path: dist/*.jar
