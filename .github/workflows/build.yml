name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  plan:
    # Only the layers that the pushed files affect are built (see .github/scripts/plan_matrix.py); docs, status and workflow
    # only pushes build nothing.
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      any: ${{ steps.plan.outputs.any }}
      test: ${{ steps.plan.outputs.test }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: plan
        env:
          BEFORE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: python3 .github/scripts/plan_matrix.py build --before "$BEFORE" --sha "${{ github.sha }}"

  versions:
    # The two loaders of each Minecraft version must carry the same mod_version (one combined jar holds both); releases are
    # tagged v<mod_version> and ship the Minecraft versions whose modules carry that version.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Both loaders of each Minecraft version agree on mod_version
        run: |
          status=0
          for mc in 1.21.1 26.1.2 26.2 26.3; do
            forge=$(sed -n 's/^mod_version=//p' forge-$mc/gradle.properties)
            neoforge=$(sed -n 's/^mod_version=//p' neoforge-$mc/gradle.properties)
            echo "$mc: forge $forge, neoforge $neoforge"
            if [ -z "$forge" ] || [ "$forge" != "$neoforge" ]; then echo "Minecraft $mc: the loaders disagree on mod_version"; status=1; fi
          done
          exit $status

  test:
    # Unit tests for the shared logic that does not need a running game. Runs when neoforge-1.21.1 is built (every change to
    # common/ or version-1.21.1/ selects it).
    needs: [versions, plan]
    if: needs.plan.outputs.test == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: neoforge-1.21.1
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - run: chmod +x gradlew
      - run: ./gradlew test --no-daemon

  build:
    needs: [versions, plan]
    if: needs.plan.outputs.any == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ matrix.module }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - run: chmod +x gradlew
      - run: ./gradlew build --no-daemon
      - uses: actions/upload-artifact@v5
        with:
          name: ${{ matrix.module }}
          path: |
            ${{ matrix.module }}/build/libs/*.jar
            !${{ matrix.module }}/build/libs/*-sources.jar
            !${{ matrix.module }}/build/libs/*-dev.jar

  combine:
    # One combined jar per Minecraft version, holding every loader's layer. Only versions whose two layers were both built in
    # this run are combined.
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          path: layers
      - name: Combine the loader jars of each Minecraft version
        run: |
          mkdir -p dist
          for mc in 1.21.1 26.1.2 26.2 26.3; do
            if [ ! -d "layers/forge-$mc" ] || [ ! -d "layers/neoforge-$mc" ]; then
              echo "$mc: not both layers built in this run, skipping"
              continue
            fi
            jars=$(ls layers/forge-$mc/*.jar layers/neoforge-$mc/*.jar)
            echo "$mc: $jars"
            version=$(grep -h '^mod_version=' forge-$mc/gradle.properties | cut -d= -f2)
            python3 scripts/combine_jars.py "dist/orangepeel-mc$mc-$version.jar" $jars
          done
          ls -la dist
      - uses: actions/upload-artifact@v5
        with:
          name: combined-jars
          path: dist/*.jar
          if-no-files-found: ignore
