name: Crash report
description: The game crashed or won't start, and OrangePeel may be involved.
title: "[Crash] "
labels: ["crash"]
body:
  - type: markdown
    attributes:
      value: |
        Sorry about the crash. The crash report is the most useful thing you can send. It's in the `crash-reports` folder of your Minecraft folder.
  - type: input
    id: crash
    attributes:
      label: Crash report link
      description: Upload the crash report to https://mclo.gs or a GitHub gist and paste the link.
      placeholder: https://mclo.gs/...
    validations:
      required: true
  - type: textarea
    id: when
    attributes:
      label: When does it crash?
      placeholder: On startup / when I join a world / when I hover a food / when I hold a food
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: OrangePeel version
    validations:
      required: true
  - type: input
    id: minecraft
    attributes:
      label: Minecraft and loader versions
      placeholder: Minecraft 1.21.1, NeoForge ...
    validations:
      required: true
  - type: dropdown
    id: side
    attributes:
      label: Which side crashed?
      options:
        - The game (client)
        - A dedicated server
        - Both
    validations:
      required: true
  - type: dropdown
    id: alone
    attributes:
      label: Does it crash with OrangePeel as the only mod?
      options:
        - "Yes"
        - "No, only with other mods"
        - "I haven't tried"
    validations:
      required: true
  - type: textarea
    id: mods
    attributes:
      label: Other mods
      description: The mods in your instance, or a link to your modpack.
