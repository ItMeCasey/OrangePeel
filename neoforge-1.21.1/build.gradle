plugins {
    id 'java-library'
    id 'idea'
    id 'net.neoforged.moddev' version '2.0.148'
}

version = mod_version
group = mod_group

base {
    archivesName = "${mod_id}-neoforge-mc${minecraft_version}"
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

// Shared code lives in ../common and is compiled into this loader layer and the combined jar.
sourceSets {
    main {
        java.srcDir '../version-1.21.1/src/main/java'
        java.srcDir "../common/src/main/java"
        resources.srcDir "../common/src/main/resources"
    }
    test {
        java.srcDir "../common/src/test/java"
    }
}

neoForge {
    version = neo_version

    runs {
        configureEach {
            gameDirectory = layout.projectDirectory.dir('run')
        }
        client {
            client()
        }
        server {
            server()
            programArgument '--nogui'
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

// neoforge.mods.toml is a template: this fills in its ${} values from gradle.properties.
var generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    var replaceProperties = [
        minecraft_version: minecraft_version, minecraft_version_range: minecraft_version_range,
        neo_version_range: neo_version_range, loader_version_range: loader_version_range,
        mod_id: mod_id, mod_name: mod_name, mod_license: mod_license, mod_version: mod_version,
        mod_authors: mod_authors, mod_description: mod_description,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from 'src/main/templates'
    into 'build/generated/sources/modMetadata'
}
sourceSets.main.resources.srcDir generateModMetadata

// Unit tests for the shared logic that does not need a running game (settings, sort choices, lock lists).
repositories {
    mavenCentral()
}

dependencies {
    testImplementation platform("org.junit:junit-bom:5.11.4")
    testImplementation "org.junit.jupiter:junit-jupiter"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
}
